      <rect x="0" y="0" width="166" height="34" rx="10" fill="#202325" stroke="#FFFFFF" stroke-opacity="0.09" filter="url(#softShadowDark)"/>
      <circle cx="17" cy="17" r="4.5" fill="#34D399"/>
      <text x="29" y="21.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="12.5" font-weight="700" fill="#F1F5F3">云端 / INT8 按需语音</text>

      <rect x="176" y="0" width="144" height="34" rx="10" fill="#202325" stroke="#FFFFFF" stroke-opacity="0.09" filter="url(#softShadowDark)"/>
      <circle cx="193" cy="17" r="4.5" fill="#E69259"/>
      <text x="205" y="21.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="12.5" font-weight="700" fill="#F1F5F3">零遮挡伴随浮窗</text>

      <rect x="330" y="0" width="146" height="34" rx="10" fill="#202325" stroke="#FFFFFF" stroke-opacity="0.09" filter="url(#softShadowDark)"/>
      <circle cx="347" cy="17" r="4.5" fill="#34D399"/>
      <text x="359" y="21.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="12.5" font-weight="700" fill="#F1F5F3">Win32 原生热键</text>
    </g>
  </g>

  <!-- ================= RIGHT UI MOCKUP PREVIEW (DARK MODE) ================= -->
  <g transform="translate(615, 34)" filter="url(#cardShadowDark)">
    <rect x="0" y="0" width="320" height="362" rx="22" fill="#161819" stroke="#FFFFFF" stroke-opacity="0.10"/>

    <!-- Top Header: Quick Orb + Title + Close -->
