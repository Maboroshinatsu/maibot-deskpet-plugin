<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#131516"/>
      <stop offset="55%" stop-color="#171A1C"/>
      <stop offset="100%" stop-color="#1E2124"/>
    </linearGradient>
    <linearGradient id="accentGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C87137"/>
      <stop offset="100%" stop-color="#E28B50"/>
    </linearGradient>
    <pattern id="dotGridDark" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#FFFFFF" fill-opacity="0.06"/>
    </pattern>
    <filter id="cardShadowDark" x="-8%" y="-8%" width="116%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <filter id="softShadowDark" x="-8%" y="-8%" width="116%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.38"/>
    </filter>
  </defs>

  <!-- Main Background -->
  <rect width="1200" height="430" rx="26" fill="url(#bgGradDark)" stroke="#FFFFFF" stroke-opacity="0.09" stroke-width="1.5"/>
  <rect width="1200" height="430" rx="26" fill="url(#dotGridDark)"/>

  <!-- Decorative Organic Glow -->
  <circle cx="1060" cy="-30" r="210" fill="#C87137" fill-opacity="0.11"/>
  <circle cx="680" cy="410" r="170" fill="#34D399" fill-opacity="0.05"/>

  <!-- ================= LEFT EDITORIAL COLUMN ================= -->
  <g transform="translate(64, 58)">
    <!-- Version Pill -->
    <rect x="0" y="0" width="218" height="30" rx="15" fill="#C87137" fill-opacity="0.20" stroke="#C87137" stroke-opacity="0.48"/>
    <circle cx="16" cy="15" r="5" fill="#E69259"/>
    <text x="30" y="19.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" font-weight="700" letter-spacing="1.2" fill="#F0A572">RELEASE v1.0.0 · STABLE</text>

    <!-- Main Title -->
    <text x="0" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="52" font-weight="800" letter-spacing="-1" fill="#F1F5F3">MaiBot Deskpet</text>
    <text x="394" y="92" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="26" font-weight="600" fill="#E69259">1.0</text>

    <!-- Subtitle -->
    <text x="0" y="134" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18.5" font-weight="600" fill="#D5DFDA">
      零遮挡伴随式 Live2D 桌面角色与多步分镜情绪引擎
    </text>
    <text x="0" y="164" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="400" fill="#9CA8A2">
      基于 Electron + Vue 3 + PixiJS (Cubism 4)，专为 MaiBot 打造的轻量级桌面伴侣。
    </text>
    <text x="0" y="186" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="400" fill="#9CA8A2">
      支持自动去水印、预设工坊关键帧编排、情绪分组随机抽取与云端/本地双模语音管线。
    </text>

    <!-- Feature Chips Row 1 -->
    <g transform="translate(0, 218)">
      <rect x="0" y="0" width="144" height="34" rx="10" fill="#202325" stroke="#FFFFFF" stroke-opacity="0.09" filter="url(#softShadowDark)"/>
      <circle cx="17" cy="17" r="4.5" fill="#E69259"/>
      <text x="29" y="21.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="12.5" font-weight="700" fill="#F1F5F3">预设工坊分镜</text>

      <rect x="154" y="0" width="156" height="34" rx="10" fill="#202325" stroke="#FFFFFF" stroke-opacity="0.09" filter="url(#softShadowDark)"/>
      <circle cx="171" cy="17" r="4.5" fill="#34D399"/>
      <text x="183" y="21.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="12.5" font-weight="700" fill="#F1F5F3">情绪分组随机抽取</text>

      <rect x="320" y="0" width="156" height="34" rx="10" fill="#202325" stroke="#FFFFFF" stroke-opacity="0.09" filter="url(#softShadowDark)"/>
      <circle cx="337" cy="17" r="4.5" fill="#E69259"/>
      <text x="349" y="21.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="12.5" font-weight="700" fill="#F1F5F3">逆变换精准视线</text>
    </g>

    <!-- Feature Chips Row 2 -->
