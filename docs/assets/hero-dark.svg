    <rect x="12" y="284" width="170" height="26" rx="8" fill="#202325"/>
    <text x="22" y="300.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="10" font-weight="600" fill="#6F7C76">双击角色唤起对话输入框…</text>
