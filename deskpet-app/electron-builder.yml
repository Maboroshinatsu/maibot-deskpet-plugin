# 打包配置 —— npm run dist 产出 NSIS 安装版 exe
#
# 布局约定（与 main/services.ts、main/index.ts 的路径解析一一对应）：
#   resources/bridges/            STT/TTS 桥脚本（ServiceManager 在这里找）
#   resources/models/             Live2D 模型（getModelsRoot → deskpet:// 协议提供）
#   resources/icon.png            托盘/窗口图标（getAppIconPath）
# 注意：
#   1. STT 默认推荐云端 ASR 直连（0 体积、无需启动本地桥）；若启用本地离线 STT，
#      stt-bridge.py 会在首次使用时按需自动下载轻量级 INT8 模型（~226MB）到 userData 目录。
#   2. 桥脚本的 Python 直接复用 MaiBot 插件上报并经用户确认的解释器（sys.executable）。
appId: com.maboroshinatsu.maibot-deskpet
productName: MaiBot Deskpet
electronDist: node_modules/electron/dist
directories:
  output: release
  buildResources: build
files:
  - out/**
  # 模型走 extraResources（deskpet:// 协议），不塞进 asar
  - "!out/renderer/models/**"
asar: true
extraResources:
  - from: ../stt-bridge.py
    to: bridges/stt-bridge.py
  - from: ../gpt-sovits-bridge.py
    to: bridges/gpt-sovits-bridge.py
  - from: ../cloud-tts-bridge.py
    to: bridges/cloud-tts-bridge.py
  - from: ../hotkey-bridge.py
    to: bridges/hotkey-bridge.py
  - from: ../watchdog.py
    to: bridges/watchdog.py
  # 只随包分发默认模型与静态立绘示例包；个人测试模型与离线语音包不进安装包
  - from: src/renderer/public/models/hiyori_pro_zh
    to: models/hiyori_pro_zh
  - from: src/renderer/public/models/sample_static
    to: models/sample_static
  - from: build/icon.png
    to: icon.png
win:
  target:
    - nsis
  icon: build/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: MaiBot 桌宠
  artifactName: MaiBot-Deskpet-Setup-${version}.exe
