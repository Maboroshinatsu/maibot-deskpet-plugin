name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Installer & Portable Zip
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify version consistency
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tagVer = "${{ github.ref_name }}" -replace '^v', ''
          $pkgVer = (Get-Content deskpet-app/package.json -Raw -Encoding UTF8 | ConvertFrom-Json).version
          $manifestVer = (Get-Content _manifest.json -Raw -Encoding UTF8 | ConvertFrom-Json).version
          $pyVer = (Select-String -Path plugin.py -Pattern 'config_version:.*default="([^"]+)"' -Encoding UTF8).Matches[0].Groups[1].Value
          Write-Host "tag=$tagVer  package.json=$pkgVer  _manifest.json=$manifestVer  plugin.py=$pyVer"
          $mismatch = @()
          if ($tagVer -ne $pkgVer)      { $mismatch += "deskpet-app/package.json=$pkgVer" }
          if ($tagVer -ne $manifestVer) { $mismatch += "_manifest.json=$manifestVer" }
          if ($tagVer -ne $pyVer)       { $mismatch += "plugin.py=$pyVer" }
          if ($mismatch.Count -gt 0) {
            throw "版本号不一致：tag 为 $tagVer，但以下文件不匹配 -> $($mismatch -join '; ')"
          }
          Write-Host "版本号一致性校验通过：$tagVer"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: deskpet-app/package-lock.json

      - name: Install dependencies
        working-directory: deskpet-app
        run: npm ci

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Python unit tests
        run: python -B -m unittest discover -s tests -p "test_*.py" -v

      - name: Run Electron unit tests
        working-directory: deskpet-app
        run: npm test

      - name: Run TypeScript typecheck
        working-directory: deskpet-app
        run: npm run typecheck

      - name: Build Electron bundle & Windows packages
        working-directory: deskpet-app
        shell: pwsh
        run: |
          npx electron-vite build
          if ($LASTEXITCODE -ne 0) { throw "electron-vite build 失败（exit $LASTEXITCODE）" }
          npx electron-builder --win nsis --publish never
          if ($LASTEXITCODE -ne 0) { throw "electron-builder 打包失败（exit $LASTEXITCODE）" }
          $ver = (Get-Content package.json | ConvertFrom-Json).version
          Compress-Archive -Path "release/win-unpacked/*" -DestinationPath "release/MaiBot-Deskpet-Portable-$ver-win-x64.zip" -Force

      - name: Publish GitHub Release assets
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          # CI 只负责上传附件；若维护者未预先创建 Release，则自动创建（release notes 自动生成）
          $exists = $false
          try {
            gh release view $tag *> $null
            $exists = ($LASTEXITCODE -eq 0)
          } catch {
            $exists = $false
          }
          if (-not $exists) {
            Write-Host "Release $tag 不存在，自动创建"
            gh release create $tag --title "MaiBot Deskpet $tag" --generate-notes
            if ($LASTEXITCODE -ne 0) { throw "自动创建 Release $tag 失败" }
          } else {
            Write-Host "Release $tag 已存在，直接上传附件"
          }
          gh release upload $tag deskpet-app/release/MaiBot-Deskpet-Setup-*.exe deskpet-app/release/MaiBot-Deskpet-Portable-*-win-x64.zip --clobber
          if ($LASTEXITCODE -ne 0) { throw "上传 Release 附件失败（exit $LASTEXITCODE）" }
