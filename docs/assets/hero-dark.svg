      <rect x="0" y="0" width="288" height="62" rx="12" fill="#202325" stroke="#C87137" stroke-opacity="0.45"/>
      <text x="12" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="9.5" font-weight="700" fill="#9CA8A2">开心 · 组内变体（后端调用时随机抽取）</text>
      <text x="220" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="9.5" font-weight="700" fill="#F0A572">随机抽取</text>
      <text x="264" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="9.5" font-weight="700" fill="#6F7C76">收起</text>

      <rect x="10" y="26" width="130" height="28" rx="8" fill="#C87137"/>
      <text x="22" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">欢呼</text>
      <text x="128" y="44" text-anchor="end" font-family="ui-monospace, Consolas, monospace" font-size="9.5" font-weight="700" fill="#FFFFFF">3步</text>

      <rect x="148" y="26" width="130" height="28" rx="8" fill="#2B2F33"/>
      <text x="160" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="11" font-weight="700" fill="#F1F5F3">歪头笑</text>
      <text x="266" y="44" text-anchor="end" font-family="ui-monospace, Consolas, monospace" font-size="9.5" font-weight="600" fill="#9CA8A2">2步</text>
    </g>

    <!-- Row 2 Group Capsules -->
    <g transform="translate(16, 310)">
      <rect x="0" y="0" width="140" height="36" rx="11" fill="#202325"/>
      <rect x="6" y="7" width="22" height="22" rx="6" fill="#2B2F33"/>
      <path d="M15 14 L19 18 L15 22" fill="none" stroke="#9CA8A2" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="34" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="12" font-weight="700" fill="#F1F5F3">害羞</text>
      <rect x="112" y="10" width="20" height="16" rx="5" fill="#2B2F33"/>
      <text x="122" y="21" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="10" font-weight="700" fill="#9CA8A2">2</text>

      <rect x="148" y="0" width="140" height="36" rx="11" fill="#202325"/>
      <rect x="154" y="7" width="22" height="22" rx="6" fill="#2B2F33"/>
      <path d="M163 14 L167 18 L163 22" fill="none" stroke="#9CA8A2" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="182" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="12" font-weight="700" fill="#F1F5F3">委屈难过</text>
      <rect x="260" y="10" width="20" height="16" rx="5" fill="#2B2F33"/>
      <text x="270" y="21" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="10" font-weight="700" fill="#9CA8A2">2</text>
    </g>
  </g>

  <!-- Companion Stage & Speech Bubble Card (Dark Mode) -->
  <g transform="translate(952, 54)" filter="url(#cardShadowDark)">
    <rect x="0" y="0" width="194" height="322" rx="22" fill="#161819" stroke="#FFFFFF" stroke-opacity="0.10"/>

    <rect x="14" y="14" width="96" height="22" rx="7" fill="#202325"/>
    <circle cx="25" cy="25" r="3.5" fill="#34D399"/>
    <text x="34" y="28.5" font-family="ui-monospace, Consolas, monospace" font-size="9.5" font-weight="700" fill="#9CA8A2">STAGE · 60FPS</text>

    <g transform="translate(97, 148)">
      <circle cx="0" cy="0" r="64" fill="#202325"/>
      <circle cx="0" cy="-6" r="28" fill="#FADCC8"/>
      <path d="M-30 -12 C-28 -38, 28 -38, 30 -12 C22 -24, 8 -20, 0 -14 C-10 -22, -22 -22, -30 -12 Z" fill="#5C4033"/>
      <path d="M-14 -6 Q-9 -12 -4 -6" fill="none" stroke="#3B2820" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M4 -6 Q9 -12 14 -6" fill="none" stroke="#3B2820" stroke-width="2.2" stroke-linecap="round"/>
      <ellipse cx="-16" cy="1" rx="4.5" ry="2.2" fill="#E88276" fill-opacity="0.55"/>
      <ellipse cx="16" cy="1" rx="4.5" ry="2.2" fill="#E88276" fill-opacity="0.55"/>
      <path d="M-5 4 Q0 9 5 4" fill="none" stroke="#C85A48" stroke-width="2" stroke-linecap="round"/>
      <path d="M-36 52 C-32 26, 32 26, 36 52 Z" fill="#C87137"/>
      <path d="M-12 27 L0 42 L12 27" fill="#F1F5F3"/>
    </g>

    <g transform="translate(12, 212)" filter="url(#softShadowDark)">
      <rect x="0" y="0" width="170" height="62" rx="13" fill="#202325" stroke="#C87137" stroke-opacity="0.48"/>
      <text x="12" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="10.5" font-weight="700" fill="#F0A572">MaiBot · 语音与表情同步</text>
      <text x="12" y="39" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="11" font-weight="600" fill="#F1F5F3">“今天想聊点什么？我已经</text>
      <text x="12" y="53" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="11" font-weight="600" fill="#F1F5F3">准备好新的分镜动作啦！”</text>
