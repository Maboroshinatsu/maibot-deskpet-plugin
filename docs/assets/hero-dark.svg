      <rect x="6" y="7" width="22" height="22" rx="6" fill="#2B2F33"/>
      <path d="M15 14 L19 18 L15 22" fill="none" stroke="#9CA8A2" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="34" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="12" font-weight="700" fill="#F1F5F3">日常待机</text>
      <circle cx="124" cy="18" r="4" fill="#34D399"/>

      <rect x="148" y="0" width="140" height="36" rx="11" fill="#C87137"/>
      <rect x="154" y="7" width="22" height="22" rx="6" fill="#FFFFFF" fill-opacity="0.22"/>
      <path d="M161 16 L165 20 L169 16" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="182" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">开心</text>
