    <rect x="19" y="55" width="92" height="26" rx="8" fill="#2B2F33"/>
    <text x="65" y="72" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="11" font-weight="700" fill="#F1F5F3">模型控件</text>
    <text x="160" y="72" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="11" font-weight="600" fill="#9CA8A2">预设工坊</text>
    <text x="254" y="72" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="11" font-weight="600" fill="#9CA8A2">打开设置</text>

