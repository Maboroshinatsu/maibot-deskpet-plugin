      <circle cx="250" cy="37" r="22" fill="#C87137" fill-opacity="0.22"/>
      <text x="14" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="9.5" font-weight="700" fill="#9CA8A2">当前激活预设 · 开心 (2 变体)</text>
      <text x="14" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="16" font-weight="800" fill="#F1F5F3">开心·欢呼</text>
      <rect x="14" y="50" width="64" height="16" rx="6" fill="#C87137" fill-opacity="0.26"/>
      <text x="46" y="61" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="9.5" font-weight="700" fill="#F0A572">播完恢复</text>
      <rect x="84" y="50" width="54" height="16" rx="6" fill="#2B2F33"/>
