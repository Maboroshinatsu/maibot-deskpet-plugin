name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Installer & Portable Zip
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: deskpet-app/package-lock.json

      - name: Install dependencies
        working-directory: deskpet-app
        run: npm ci

      - name: Run unit tests & typecheck
        working-directory: deskpet-app
        run: |
          npm test
          npm run typecheck

      - name: Build Electron bundle & Windows packages
        working-directory: deskpet-app
        run: |
          npx electron-vite build
          npx electron-builder --win nsis zip --publish never

      - name: Upload unsigned build artifacts (for SignPath verification)
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-installer
          path: |
            deskpet-app/release/MaiBot-Deskpet-Setup-*.exe
            deskpet-app/release/MaiBot-Deskpet-Portable-*-win-x64.zip
          if-no-files-found: error

      # SignPath Foundation 审批通过并配置仓库 Variable SIGNPATH_ORGANIZATION_ID 与 Secret SIGNPATH_API_TOKEN 后自动启用签名
      - name: Submit signing request to SignPath
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' && startsWith(github.ref, 'refs/tags/v') }}
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: 'maibot-deskpet-plugin'
          signing-policy-slug: 'release-signing'
          github-artifact-id: 'unsigned-installer'
          wait-for-completion: true
          output-artifact-directory: 'deskpet-app/release-signed'

      - name: Publish GitHub Release assets
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if (Test-Path "deskpet-app/release-signed") {
            gh release upload ${{ github.ref_name }} deskpet-app/release-signed/* --clobber
          } else {
            gh release upload ${{ github.ref_name }} deskpet-app/release/MaiBot-Deskpet-Setup-*.exe deskpet-app/release/MaiBot-Deskpet-Portable-*-win-x64.zip --clobber
          }
