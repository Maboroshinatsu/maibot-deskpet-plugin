    <text x="48" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="12.5" font-weight="800" fill="#F1F5F3">hiyori_pro_zh</text>
    <text x="48" y="38" font-family="ui-monospace, Consolas, monospace" font-size="9.5" font-weight="600" fill="#6F7C76">LIVE2D · 15 PRESETS</text>
    <rect x="280" y="16" width="24" height="24" rx="8" fill="#202325"/>
    <path d="M288 24 L296 32 M296 24 L288 32" stroke="#9CA8A2" stroke-width="1.6" stroke-linecap="round"/>

    <!-- Segmented Tabs -->
