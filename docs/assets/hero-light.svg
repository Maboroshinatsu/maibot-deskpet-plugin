<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF7F2"/>
      <stop offset="55%" stop-color="#F3EFEA"/>
      <stop offset="100%" stop-color="#EAE3DA"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C87137"/>
      <stop offset="100%" stop-color="#DF8E56"/>
    </linearGradient>
    <linearGradient id="sageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2C5E28"/>
      <stop offset="100%" stop-color="#487E43"/>
    </linearGradient>
    <pattern id="dotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#172B1A" fill-opacity="0.06"/>
    </pattern>
    <filter id="cardShadow" x="-8%" y="-8%" width="116%" height="120%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#18301C" flood-opacity="0.10"/>
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#18301C" flood-opacity="0.05"/>
    </filter>
    <filter id="softShadow" x="-8%" y="-8%" width="116%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#18301C" flood-opacity="0.07"/>
    </filter>
  </defs>

  <!-- Main Background -->
  <rect width="1200" height="430" rx="26" fill="url(#bgGrad)" stroke="#172B1A" stroke-opacity="0.08" stroke-width="1.5"/>
  <rect width="1200" height="430" rx="26" fill="url(#dotGrid)"/>

  <!-- Decorative Organic Shapes -->
  <circle cx="1060" cy="-30" r="210" fill="#C87137" fill-opacity="0.07"/>
  <circle cx="680" cy="410" r="170" fill="#2C5E28" fill-opacity="0.05"/>

  <!-- ================= LEFT EDITORIAL COLUMN ================= -->
  <g transform="translate(64, 58)">
    <!-- Version Pill -->
    <rect x="0" y="0" width="218" height="30" rx="15" fill="#C87137" fill-opacity="0.13" stroke="#C87137" stroke-opacity="0.35"/>
    <circle cx="16" cy="15" r="5" fill="#C87137"/>
    <text x="30" y="19.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" font-weight="700" letter-spacing="1.2" fill="#A65520">RELEASE v1.0.0 · STABLE</text>

    <!-- Main Title -->
    <text x="0" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="52" font-weight="800" letter-spacing="-1" fill="#172B1A">MaiBot Deskpet</text>
    <text x="394" y="92" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="26" font-weight="600" fill="#C87137">1.0</text>

    <!-- Subtitle -->
    <text x="0" y="134" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18.5" font-weight="600" fill="#374B3A">
      零遮挡伴随式 Live2D 桌面角色与多步分镜情绪引擎
    </text>
    <text x="0" y="164" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="400" fill="#5A6B5C">
      基于 Electron + Vue 3 + PixiJS (Cubism 4)，专为 MaiBot 打造的轻量级桌面伴侣。
    </text>
    <text x="0" y="186" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="400" fill="#5A6B5C">
      支持自动去水印、预设工坊关键帧编排、情绪分组随机抽取与云端/本地双模语音管线。
    </text>

    <!-- Feature Chips Row 1 -->
    <g transform="translate(0, 218)">
      <rect x="0" y="0" width="144" height="34" rx="10" fill="#FFFFFF" stroke="#172B1A" stroke-opacity="0.09" filter="url(#softShadow)"/>
      <circle cx="17" cy="17" r="4.5" fill="#C87137"/>
      <text x="29" y="21.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="12.5" font-weight="700" fill="#172B1A">预设工坊分镜</text>

      <rect x="154" y="0" width="156" height="34" rx="10" fill="#FFFFFF" stroke="#172B1A" stroke-opacity="0.09" filter="url(#softShadow)"/>
      <circle cx="171" cy="17" r="4.5" fill="#2C5E28"/>
      <text x="183" y="21.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="12.5" font-weight="700" fill="#172B1A">情绪分组随机抽取</text>

      <rect x="320" y="0" width="156" height="34" rx="10" fill="#FFFFFF" stroke="#172B1A" stroke-opacity="0.09" filter="url(#softShadow)"/>
      <circle cx="337" cy="17" r="4.5" fill="#C87137"/>
      <text x="349" y="21.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="12.5" font-weight="700" fill="#172B1A">逆变换精准视线</text>
    </g>

    <!-- Feature Chips Row 2 -->
    <g transform="translate(0, 262)">
      <rect x="0" y="0" width="166" height="34" rx="10" fill="#FFFFFF" stroke="#172B1A" stroke-opacity="0.09" filter="url(#softShadow)"/>
      <circle cx="17" cy="17" r="4.5" fill="#2C5E28"/>
      <text x="29" y="21.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="12.5" font-weight="700" fill="#172B1A">云端 / INT8 按需语音</text>

      <rect x="176" y="0" width="144" height="34" rx="10" fill="#FFFFFF" stroke="#172B1A" stroke-opacity="0.09" filter="url(#softShadow)"/>
      <circle cx="193" cy="17" r="4.5" fill="#C87137"/>
      <text x="205" y="21.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="12.5" font-weight="700" fill="#172B1A">零遮挡伴随浮窗</text>

      <rect x="330" y="0" width="146" height="34" rx="10" fill="#FFFFFF" stroke="#172B1A" stroke-opacity="0.09" filter="url(#softShadow)"/>
      <circle cx="347" cy="17" r="4.5" fill="#2C5E28"/>
      <text x="359" y="21.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="12.5" font-weight="700" fill="#172B1A">Win32 原生热键</text>
    </g>
  </g>

  <!-- ================= RIGHT UI MOCKUP PREVIEW ================= -->
  <!-- Companion Settings Panel Card -->
  <g transform="translate(615, 34)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="320" height="362" rx="22" fill="#FFFFFF" stroke="#172B1A" stroke-opacity="0.08"/>

    <!-- Top Header: Quick Orb + Title + Close -->
    <circle cx="28" cy="28" r="11" fill="url(#accentGrad)"/>
    <text x="48" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="12.5" font-weight="800" fill="#172B1A">hiyori_pro_zh</text>
    <text x="48" y="38" font-family="ui-monospace, Consolas, monospace" font-size="9.5" font-weight="600" fill="#7E8C7F">LIVE2D · 15 PRESETS</text>
    <rect x="280" y="16" width="24" height="24" rx="8" fill="#F3EFEA"/>
    <path d="M288 24 L296 32 M296 24 L288 32" stroke="#5A6B5C" stroke-width="1.6" stroke-linecap="round"/>

    <!-- Segmented Tabs -->
    <rect x="16" y="52" width="288" height="32" rx="11" fill="#F3EFEA"/>
    <rect x="19" y="55" width="92" height="26" rx="8" fill="#FFFFFF" filter="url(#softShadow)"/>
    <text x="65" y="72" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="11" font-weight="700" fill="#172B1A">模型控件</text>
    <text x="160" y="72" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="11" font-weight="600" fill="#5A6B5C">预设工坊</text>
    <text x="254" y="72" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="11" font-weight="600" fill="#5A6B5C">打开设置</text>

    <!-- Hero Active Preset Card -->
    <g transform="translate(16, 96)">
      <rect x="0" y="0" width="288" height="74" rx="16" fill="#F3EFEA"/>
      <circle cx="250" cy="37" r="22" fill="#D8B898" fill-opacity="0.42"/>
      <text x="14" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="9.5" font-weight="700" fill="#7E8C7F">当前激活预设 · 开心 (2 变体)</text>
      <text x="14" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="16" font-weight="800" fill="#172B1A">开心·欢呼</text>
      <rect x="14" y="50" width="64" height="16" rx="6" fill="#C87137" fill-opacity="0.15"/>
      <text x="46" y="61" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="9.5" font-weight="700" fill="#C87137">播完恢复</text>
      <rect x="84" y="50" width="54" height="16" rx="6" fill="#FFFFFF" fill-opacity="0.85"/>
      <text x="111" y="61" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="9.5" font-weight="700" fill="#5A6B5C">3 步分镜</text>
    </g>

    <!-- Section Header -->
    <text x="18" y="190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="10" font-weight="700" fill="#7E8C7F">状态预设分组（点击切换 · 箭头展开变体）</text>

    <!-- 2-Column Group Capsules -->
    <g transform="translate(16, 198)">
      <!-- Capsule 1: 待机 -->
      <rect x="0" y="0" width="140" height="36" rx="11" fill="#F3EFEA"/>
      <rect x="6" y="7" width="22" height="22" rx="6" fill="#FFFFFF" fill-opacity="0.7"/>
      <path d="M15 14 L19 18 L15 22" fill="none" stroke="#5A6B5C" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="34" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="12" font-weight="700" fill="#172B1A">日常待机</text>
      <circle cx="124" cy="18" r="4" fill="#2C5E28"/>

      <!-- Capsule 2: 开心 (Active & Expanded) -->
      <rect x="148" y="0" width="140" height="36" rx="11" fill="#C87137"/>
      <rect x="154" y="7" width="22" height="22" rx="6" fill="#FFFFFF" fill-opacity="0.22"/>
      <path d="M161 16 L165 20 L169 16" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="182" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">开心</text>
      <rect x="260" y="10" width="20" height="16" rx="5" fill="#FFFFFF" fill-opacity="0.24"/>
      <text x="270" y="21" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="10" font-weight="700" fill="#FFFFFF">2</text>
    </g>

    <!-- Expanded Variant Accordion Drawer -->
    <g transform="translate(16, 240)">
      <rect x="0" y="0" width="288" height="62" rx="12" fill="#F3EFEA" stroke="#C87137" stroke-opacity="0.28"/>
      <text x="12" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="9.5" font-weight="700" fill="#5A6B5C">开心 · 组内变体（后端调用时随机抽取）</text>
      <text x="220" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="9.5" font-weight="700" fill="#C87137">随机抽取</text>
      <text x="264" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="9.5" font-weight="700" fill="#7E8C7F">收起</text>

      <rect x="10" y="26" width="130" height="28" rx="8" fill="#C87137"/>
      <text x="22" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">欢呼</text>
      <text x="128" y="44" text-anchor="end" font-family="ui-monospace, Consolas, monospace" font-size="9.5" font-weight="700" fill="#FFFFFF">3步</text>

      <rect x="148" y="26" width="130" height="28" rx="8" fill="#FFFFFF"/>
      <text x="160" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="11" font-weight="700" fill="#172B1A">歪头笑</text>
      <text x="266" y="44" text-anchor="end" font-family="ui-monospace, Consolas, monospace" font-size="9.5" font-weight="600" fill="#7E8C7F">2步</text>
    </g>

    <!-- Row 2 Group Capsules -->
    <g transform="translate(16, 310)">
      <rect x="0" y="0" width="140" height="36" rx="11" fill="#F3EFEA"/>
      <rect x="6" y="7" width="22" height="22" rx="6" fill="#FFFFFF" fill-opacity="0.7"/>
      <path d="M15 14 L19 18 L15 22" fill="none" stroke="#5A6B5C" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="34" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="12" font-weight="700" fill="#172B1A">害羞</text>
      <rect x="112" y="10" width="20" height="16" rx="5" fill="#FFFFFF" fill-opacity="0.8"/>
      <text x="122" y="21" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="10" font-weight="700" fill="#5A6B5C">2</text>

      <rect x="148" y="0" width="140" height="36" rx="11" fill="#F3EFEA"/>
      <rect x="154" y="7" width="22" height="22" rx="6" fill="#FFFFFF" fill-opacity="0.7"/>
      <path d="M163 14 L167 18 L163 22" fill="none" stroke="#5A6B5C" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="182" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="12" font-weight="700" fill="#172B1A">委屈难过</text>
      <rect x="260" y="10" width="20" height="16" rx="5" fill="#FFFFFF" fill-opacity="0.8"/>
      <text x="270" y="21" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="10" font-weight="700" fill="#5A6B5C">2</text>
    </g>
  </g>

  <!-- Companion Stage & Speech Bubble Card (Right side) -->
  <g transform="translate(952, 54)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="194" height="322" rx="22" fill="#FFFFFF" fill-opacity="0.92" stroke="#172B1A" stroke-opacity="0.08"/>

    <!-- Stage Header Badge -->
    <rect x="14" y="14" width="96" height="22" rx="7" fill="#F3EFEA"/>
    <circle cx="25" cy="25" r="3.5" fill="#34D399"/>
    <text x="34" y="28.5" font-family="ui-monospace, Consolas, monospace" font-size="9.5" font-weight="700" fill="#5A6B5C">STAGE · 60FPS</text>

    <!-- Stylized Live2D Avatar Vector Illustration -->
    <g transform="translate(97, 148)">
      <circle cx="0" cy="0" r="64" fill="#F3EFEA"/>
      <circle cx="0" cy="-6" r="28" fill="#FADCC8"/>
      <!-- Hair Bangs -->
      <path d="M-30 -12 C-28 -38, 28 -38, 30 -12 C22 -24, 8 -20, 0 -14 C-10 -22, -22 -22, -30 -12 Z" fill="#5C4033"/>
      <!-- Happy Smile Eyes -->
      <path d="M-14 -6 Q-9 -12 -4 -6" fill="none" stroke="#3B2820" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M4 -6 Q9 -12 14 -6" fill="none" stroke="#3B2820" stroke-width="2.2" stroke-linecap="round"/>
      <!-- Blush -->
      <ellipse cx="-16" cy="1" rx="4.5" ry="2.2" fill="#E88276" fill-opacity="0.55"/>
      <ellipse cx="16" cy="1" rx="4.5" ry="2.2" fill="#E88276" fill-opacity="0.55"/>
      <!-- Smile Mouth -->
      <path d="M-5 4 Q0 9 5 4" fill="none" stroke="#C85A48" stroke-width="2" stroke-linecap="round"/>
      <!-- Shoulders / Outfit -->
      <path d="M-36 52 C-32 26, 32 26, 36 52 Z" fill="#C87137"/>
      <path d="M-12 27 L0 42 L12 27" fill="#FFFFFF"/>
    </g>

    <!-- Speech Bubble at Lower 1/3 -->
    <g transform="translate(12, 212)" filter="url(#softShadow)">
      <rect x="0" y="0" width="170" height="62" rx="13" fill="#FFFFFF" stroke="#C87137" stroke-opacity="0.35"/>
      <text x="12" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="10.5" font-weight="700" fill="#C87137">MaiBot · 语音与表情同步</text>
      <text x="12" y="39" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="11" font-weight="600" fill="#172B1A">“今天想聊点什么？我已经</text>
      <text x="12" y="53" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="11" font-weight="600" fill="#172B1A">准备好新的分镜动作啦！”</text>
    </g>

    <!-- Bottom Quick Input Preview -->
    <rect x="12" y="284" width="170" height="26" rx="8" fill="#F3EFEA"/>
    <text x="22" y="300.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="10" font-weight="600" fill="#7E8C7F">双击角色唤起对话输入框…</text>
  </g>
</svg>
